name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -e
          for f in module/*.sh module/mg; do
            sh -n "$f"
            echo "ok $f"
          done
          sh -n build.sh

      - name: Build slim zip
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magpie-gateway-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build both zips
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          ./build.sh
          ./build.sh --full

      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # dist/ holds the slim zip and the -full one; one glob matches both,
          # since two overlapping patterns would offer the same file twice
          files: |
            dist/*.zip
            dist/SHA256SUMS
          # 中文说明写在仓库里，tag 推送时自动套用；不再用自动生成的英文说明
          body_path: release-notes/${{ github.ref_name }}.md
          name: ${{ github.ref_name }}
